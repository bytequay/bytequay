<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Check a change — ByteQuay Lab illustrated preview</title><desc id="desc">Keep the decision connected to what happened next. Synthetic example data, not measured product results.</desc><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9e80ee" stop-opacity=".3"/><stop offset="1" stop-color="#9e80ee" stop-opacity="0"/></linearGradient></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#12151e" stroke="none"/><rect x="0" y="0" width="220" height="900" rx="0" fill="#171a24" stroke="none"/><line x1="220" y1="0" x2="220" y2="900" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><line x1="0" y1="72" x2="1440" y2="72" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><rect x="24" y="23" width="27" height="27" rx="7" fill="#a082e2" stroke="none"/><text x="37.5" y="43" font-size="17" fill="#17111f" font-weight="700" text-anchor="middle">B</text><text x="64" y="44" font-size="20" fill="#eef0f7" font-weight="650" text-anchor="start">ByteQuay Lab</text><circle cx="1274" cy="37" r="4" fill="#68d9b0"/><text x="1290" y="43" font-size="13" fill="#939bad" font-weight="600" text-anchor="start">LOCAL</text><text x="263" y="44" font-size="12" fill="#939bad" font-weight="500" text-anchor="start">ILLUSTRATED PREVIEW / SAMPLE DATA</text><circle cx="32" cy="112" r="3" fill="#626b80"/><text x="49" y="118" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Overview</text><circle cx="32" cy="163" r="3" fill="#626b80"/><text x="49" y="169" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Resources</text><circle cx="32" cy="214" r="3" fill="#626b80"/><text x="49" y="220" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Reviews</text><circle cx="32" cy="265" r="3" fill="#626b80"/><text x="49" y="271" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Context</text><circle cx="32" cy="316" r="3" fill="#626b80"/><text x="49" y="322" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Memory</text><circle cx="32" cy="367" r="3" fill="#626b80"/><text x="49" y="373" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Tuning</text><circle cx="32" cy="418" r="3" fill="#626b80"/><text x="49" y="424" font-size="17" fill="#939bad" font-weight="400" text-anchor="start">Delivery</text><rect x="12" y="449" width="195" height="43" rx="7" fill="#302b43" stroke="none"/><circle cx="32" cy="469" r="3" fill="#ba9cff"/><text x="49" y="475" font-size="17" fill="#eef0f7" font-weight="500" text-anchor="start">Suggestions</text><line x1="24" y1="564" x2="196" y2="564" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="25" y="604" font-size="11" fill="#939bad" font-weight="600" text-anchor="start">REPOSITORY</text><rect x="23" y="620" width="172" height="39" rx="6" fill="#1d212e" stroke="#2b303f"/><text x="35" y="646" font-size="15" fill="#eef0f7" font-weight="400" text-anchor="start">Example project</text><text x="24" y="830" font-size="14" fill="#939bad" font-weight="400" text-anchor="start">Python toolkit</text><text x="24" y="853" font-size="14" fill="#939bad" font-weight="400" text-anchor="start">On your Mac</text><text x="264" y="137" font-size="36" fill="#eef0f7" font-weight="650" text-anchor="start">Check a change</text><text x="264" y="174" font-size="18" fill="#939bad" font-weight="400" text-anchor="start">Keep the decision connected to what happened next.</text><rect x="264" y="208" width="360" height="141" rx="12" fill="#1d202e" stroke="#2b303f"/><text x="286" y="240" font-size="13" fill="#ba9cff" font-weight="600" text-anchor="start">01  OBSERVE</text><text x="286" y="281" font-size="22" fill="#eef0f7" font-weight="600" text-anchor="start">Repeated test output</text><text x="286" y="316" font-size="15" fill="#939bad" font-weight="400" text-anchor="start">Large logs carried into later calls</text><rect x="640" y="208" width="360" height="141" rx="12" fill="#1d202e" stroke="#2b303f"/><text x="662" y="240" font-size="13" fill="#ba9cff" font-weight="600" text-anchor="start">02  CHANGE</text><text x="662" y="281" font-size="22" fill="#eef0f7" font-weight="600" text-anchor="start">Cap routine output</text><text x="662" y="316" font-size="15" fill="#939bad" font-weight="400" text-anchor="start">Keep failures and a short summary</text><rect x="1016" y="208" width="360" height="141" rx="12" fill="#1d202e" stroke="#2b303f"/><text x="1038" y="240" font-size="13" fill="#ba9cff" font-weight="600" text-anchor="start">03  FOLLOW UP</text><text x="1038" y="281" font-size="22" fill="#eef0f7" font-weight="600" text-anchor="start">Not clear yet</text><text x="1038" y="316" font-size="15" fill="#939bad" font-weight="400" text-anchor="start">Wait for more comparable work</text><rect x="264" y="374" width="727" height="426" rx="12" fill="#1a1e29" stroke="#2b303f"/><text x="290" y="413" font-size="20" fill="#eef0f7" font-weight="600" text-anchor="start">Input tokens per comparable turn</text><rect x="741" y="393" width="225" height="34" rx="17" fill="#222333" stroke="#39354b"/><text x="853.5" y="416" font-size="15" fill="#ba9cff" font-weight="500" text-anchor="middle">Same model + effort</text><line x1="327" y1="466" x2="952" y2="466" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="315" y="471" font-size="13" fill="#939bad" font-weight="400" text-anchor="end">120k</text><line x1="327" y1="550" x2="952" y2="550" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="315" y="555" font-size="13" fill="#939bad" font-weight="400" text-anchor="end">80k</text><line x1="327" y1="634" x2="952" y2="634" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="315" y="639" font-size="13" fill="#939bad" font-weight="400" text-anchor="end">40k</text><line x1="327" y1="718" x2="952" y2="718" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="315" y="723" font-size="13" fill="#939bad" font-weight="400" text-anchor="end">0</text><line x1="640" y1="445" x2="640" y2="727" stroke="#75648b" stroke-width="1" stroke-dasharray="5 6"/><text x="640" y="758" font-size="14" fill="#ba9cff" font-weight="500" text-anchor="middle">Change recorded</text><circle cx="351" cy="554" r="7" fill="#ba9cff"/><circle cx="403" cy="491" r="7" fill="#ba9cff"/><circle cx="455" cy="608" r="7" fill="#ba9cff"/><circle cx="507" cy="538" r="7" fill="#ba9cff"/><circle cx="559" cy="581" r="7" fill="#ba9cff"/><circle cx="611" cy="520" r="7" fill="#ba9cff"/><circle cx="663" cy="601" r="7" fill="#68d9b0"/><circle cx="715" cy="557" r="7" fill="#68d9b0"/><circle cx="767" cy="596" r="7" fill="#68d9b0"/><circle cx="819" cy="491" r="7" fill="#68d9b0"/><circle cx="871" cy="615" r="7" fill="#68d9b0"/><circle cx="923" cy="539" r="7" fill="#68d9b0"/><line x1="338" y1="554" x2="620" y2="554" stroke="#ba9cff" stroke-width="3" stroke-dasharray=""/><line x1="667" y1="563" x2="938" y2="563" stroke="#68d9b0" stroke-width="3" stroke-dasharray=""/><rect x="1014" y="374" width="362" height="426" rx="12" fill="#1a1e29" stroke="#2b303f"/><text x="1040" y="413" font-size="20" fill="#eef0f7" font-weight="600" text-anchor="start">What the evidence says</text><rect x="1039" y="436" width="311" height="54" rx="9" fill="#3a3022" stroke="#675234"/><text x="1194" y="471" font-size="22" fill="#e6c58f" font-weight="600" text-anchor="middle">Not clear yet</text><text x="1040" y="540" font-size="22" fill="#eef0f7" font-weight="600" text-anchor="start">Small sample</text><text x="1040" y="576" font-size="18" fill="#939bad" font-weight="400" text-anchor="start">The ranges still overlap.</text><text x="1040" y="605" font-size="18" fill="#939bad" font-weight="400" text-anchor="start">More work may change</text><text x="1040" y="634" font-size="18" fill="#939bad" font-weight="400" text-anchor="start">the conclusion.</text><line x1="1040" y1="666" x2="1349" y2="666" stroke="#2b303f" stroke-width="1" stroke-dasharray=""/><text x="1040" y="706" font-size="19" fill="#eef0f7" font-weight="500" text-anchor="start">Keep quality in view.</text><text x="1040" y="739" font-size="16" fill="#939bad" font-weight="400" text-anchor="start">Fewer tokens alone is not a win.</text><text x="1375" y="851" font-size="14" fill="#939bad" font-weight="400" text-anchor="end">Example follow-up · A trend does not establish the cause</text></g></svg>
