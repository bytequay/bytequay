# Test-only overrides. The prod application.properties points the SQLite
# datasource at a macOS-specific path under ~/Library/Application Support;
# CI runs on Linux and unit tests should never touch a real user DB
# anyway, so redirect to a unique temp file per Spring test context.
# Reusing a fixed path lets orphaned local task rows wake the scheduler
# in later runs and can make unrelated tests fight over SQLite locks.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/bytequay-test-${user.name}-${random.uuid}.db?journal_mode=MEMORY&foreign_keys=ON
spring.flyway.clean-disabled=false
