name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MAVEN_OPTS: '-Xmx1G -XX:+ExitOnOutOfMemoryError'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and check backend modules
        id: build
        working-directory: backend
        run: mvn -B install -Dmaven.test.skip=true
      - name: Test core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :core test -Dcheckstyle.skip=true -Dlicense.skip=true
      - name: Test agent SPI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :agent-spi test -Dcheckstyle.skip=true -Dlicense.skip=true
      - name: Test agent core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :agent-core test -Dcheckstyle.skip=true -Dlicense.skip=true
      - name: Test agent CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :agent-cli test -Dcheckstyle.skip=true -Dlicense.skip=true
      - name: Test SQLite persistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :persistence-sqlite test -Dcheckstyle.skip=true -Dlicense.skip=true
      - name: Test application
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: backend
        run: mvn -B -pl :app test -Dcheckstyle.skip=true -Dlicense.skip=true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check licenses
        working-directory: frontend
        run: npm run check:licenses
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Package
        working-directory: frontend
        run: npm run package
