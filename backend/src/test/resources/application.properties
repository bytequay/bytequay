# Test-only overrides. The prod application.properties points the SQLite
# datasource at a macOS-specific path under ~/Library/Application Support;
# CI runs on Linux and unit tests should never touch a real user DB
# anyway, so redirect to a unique temp file per Spring test context.
# Reusing a fixed path lets orphaned local thread rows wake the scheduler
# in later runs and can make unrelated tests fight over SQLite locks.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/bytequay-test-${user.name}-${random.uuid}.db?journal_mode=MEMORY&foreign_keys=ON&busy_timeout=30000
bytequay.new-flow.database-path=${java.io.tmpdir}/bytequay-new-flow-test-${user.name}-${random.uuid}.db
# Match production's SQLite writer serialization. This test resource shadows
# main application.properties rather than inheriting its Hikari settings.
spring.datasource.hikari.maximum-pool-size=1
spring.flyway.clean-disabled=false
bytequay.scheduling.enabled=false
# Never let the CodeGraph installer reach the network or the real app-support
# dir during tests; fall back to a codegraph on PATH (absent in CI), matching
# the pre-managed behaviour the suite was written against.
bytequay.codegraph.auto-install=false
