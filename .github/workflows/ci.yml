name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# Run JavaScript-based actions on the runner's Node 24 instead of
# Node 20. GitHub forces this default starting June 2nd, 2026 and
# removes Node 20 from the runner image on September 16th, 2026; opt
# in early so we're already on the supported runtime when that lands.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MAVEN_OPTS: "-Xmx1G -XX:+ExitOnOutOfMemoryError"
  # Keep dependency-cache restores from hanging too long on a stuck cache
  # segment. setup-java/setup-node both use actions/cache under the hood.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

# Cancel previous PR builds once a newer commit arrives. Push builds keep a
# commit-scoped group so mainline CI still records each pushed revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.sha }}
  cancel-in-progress: true

jobs:

  # ── Workflow hygiene ──────────────────────────────────────────────────────

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

  # ── Path detection ────────────────────────────────────────────────────────

  path-filters:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ── Backend ───────────────────────────────────────────────────────────────
  #
  # Two-job split mirrors Trino's separation of maven-checks from test
  # execution, so static analysis surfaces its own verdict in a couple of
  # minutes instead of behind the whole suite.
  #
  # The two run side by side rather than in sequence. Chaining them added the
  # static-analysis time to every green build's wall clock, and a red analysis
  # only wastes runner minutes on tests nobody reads — pull request pushes
  # cancel in flight anyway (see `concurrency` above). Because the analysis has
  # its own job, the test job skips license, checkstyle and Error Prone rather
  # than paying for the same compile-time analysis a second time.

  backend-checks:
    name: Backend — license, checkstyle, Error Prone, compile
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: License headers, checkstyle, Error Prone, compile
        working-directory: backend
        # -DskipTests compiles and runs all bound plugins (license-maven-plugin,
        # maven-checkstyle-plugin, Error Prone via maven-compiler-plugin) without
        # executing the JUnit / Spring test suite. Failures here are fast to fix
        # and cheap to re-run, so they gate the test job below.
        run: mvn -B verify -Perrorprone,development-flow-tests -DskipTests

  backend-tests:
    name: Backend — tests
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit / Spring tests
        working-directory: backend
        # License headers, checkstyle and Error Prone are the backend-checks
        # job's verdict; repeating them here only slows the suite down. Error
        # Prone alone more than doubles the time to compile main + test sources.
        run: mvn -B test -Pdevelopment-flow-tests -DskipErrorProne -Dcheckstyle.skip -Dlicense.skip

  # ── Frontend ──────────────────────────────────────────────────────────────
  #
  # frontend-checks is a fast gate (~3 min). frontend-tests and
  # frontend-build both depend on it but run in parallel with each other so
  # the slower package build does not block seeing test failures.

  frontend-checks:
    name: Frontend — lint, license & type check
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint catches things tsc can't see: unused identifiers,
        # missing hook deps, accidental fallthroughs, AND missing
        # Apache 2.0 license headers (eslint-plugin-header).
        run: npm run lint

      - name: Check production dependency licenses
        working-directory: frontend
        # Fails if any --production dep ships under a license outside the
        # allowlist — catches a transitive GPL / AGPL dep slipping in.
        run: npm run check:licenses

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend — unit & component tests
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        # The render-smoke spec for PullRequestPreview catches the
        # "X is not defined" class of bug that slips past tsc when JSX
        # references a removed identifier.
        run: npm test

  frontend-build:
    name: Frontend — package build
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 25 (for the Forge generateAssets hook)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (electron-forge package)
        working-directory: frontend
        # Runs the full Vite + electron-packager pipeline. Catches Vite
        # plugin / asset resolution / preload-bundling regressions that
        # tsc and unit tests can't see.
        run: npm run package

  # ── Per-commit bisectability check ───────────────────────────────────────
  #
  # Mirrors Trino's check-commits-dispatcher + check-commit pattern.
  # Every commit on a PR must compile independently so that git-bisect
  # and cherry-picks always land on a working tree.
  #
  # check-commits-dispatcher enumerates the commits; check-commit fans
  # them out as a parallel matrix — one runner per commit.

  check-commits-dispatcher:
    name: Enumerate commits for per-commit check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build commit matrix
        id: list
        run: |
          shas=$(git log --format='%H' "origin/${{ github.base_ref }}"..HEAD)
          if [ -z "$shas" ]; then
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "$shas" | jq -R . | jq -sc '{sha: .}')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  check-commit:
    name: "Check commit ${{ matrix.sha }}"
    needs: check-commits-dispatcher
    if: needs.check-commits-dispatcher.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-commits-dispatcher.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend compile
        working-directory: backend
        run: mvn -B compile -DskipTests

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Aggregate gate ────────────────────────────────────────────────────────

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - workflow-lint
      - path-filters
      - backend-checks
      - backend-tests
      - frontend-checks
      - frontend-tests
      - frontend-build
      - check-commits-dispatcher
      - check-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo '${{ needs.workflow-lint.result }}'          | grep -xE 'success|skipped' || { echo 'Job "workflow-lint" failed'          >&2; exit 1; }
          echo '${{ needs.path-filters.result }}'          | grep -xE 'success|skipped' || { echo 'Job "path-filters" failed'          >&2; exit 1; }
          echo '${{ needs.backend-checks.result }}'        | grep -xE 'success|skipped' || { echo 'Job "backend-checks" failed'        >&2; exit 1; }
          echo '${{ needs.backend-tests.result }}'         | grep -xE 'success|skipped' || { echo 'Job "backend-tests" failed'         >&2; exit 1; }
          echo '${{ needs.frontend-checks.result }}'       | grep -xE 'success|skipped' || { echo 'Job "frontend-checks" failed'       >&2; exit 1; }
          echo '${{ needs.frontend-tests.result }}'        | grep -xE 'success|skipped' || { echo 'Job "frontend-tests" failed'        >&2; exit 1; }
          echo '${{ needs.frontend-build.result }}'        | grep -xE 'success|skipped' || { echo 'Job "frontend-build" failed'        >&2; exit 1; }
          echo '${{ needs.check-commits-dispatcher.result }}' | grep -xE 'success|skipped' || { echo 'Job "check-commits-dispatcher" failed' >&2; exit 1; }
          echo '${{ needs.check-commit.result }}'          | grep -xE 'success|skipped' || { echo 'Job "check-commit" failed'          >&2; exit 1; }
