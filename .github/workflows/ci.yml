name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MAVEN_OPTS: '-Xmx1G -XX:+ExitOnOutOfMemoryError'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: temurin
          cache: maven
      - name: Build and test backend modules
        working-directory: backend
        run: mvn -B -fae install

  frontend:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: temurin
          cache: maven
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check licenses
        working-directory: frontend
        run: npm run check:licenses
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Package
        working-directory: frontend
        run: npm run package

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Test dev launcher
        run: python3 scripts/test_dev.py
      - name: Test review calibration
        working-directory: scripts/review-calibration
        run: uv run --locked python -m unittest discover -p 'test_*.py'
