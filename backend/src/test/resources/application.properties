# Test-only overrides. The prod application.properties points the SQLite
# datasource at a macOS-specific path under ~/Library/Application Support;
# CI runs on Linux and unit tests should never touch a real user DB
# anyway, so redirect to a process-local temp file. The DB is recreated
# fresh on every test run via Flyway, so leftover files between runs are
# fine.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/bytequay-test-${user.name}.db?journal_mode=MEMORY&foreign_keys=ON
spring.flyway.clean-disabled=false
