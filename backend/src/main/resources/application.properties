spring.application.name=bytequay-backend
server.port=53123
server.address=127.0.0.1
logging.level.com.bytequay=INFO
# Hibernate's connection-info banner reports "undefined/unknown" for
# fields it can't introspect through Hikari (driver name, autocommit,
# isolation, pool sizes). The values themselves are configured below;
# the banner is just cosmetic noise — quiet it down.
logging.level.org.hibernate.orm.connections.pooling=WARN

# ── Log file rotation ────────────────────────────────────────────────────
# Stdout still logs (inherited by Electron in dev), but in a packaged .app
# launched from Finder there's no terminal — the file is the only place
# logs survive. ~/Library/Logs is the macOS standard so Console.app picks
# it up. Caps: 10 MB per file, 7 archived files, 100 MB total — bounded so
# a chatty week can't fill the user's disk.
logging.file.name=${user.home}/Library/Logs/ByteQuay/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# ── SQLite datasource ────────────────────────────────────────────────────
# DB file lives at ~/Library/Application Support/ByteQuay/bytequay.db.
#   journal_mode=WAL — concurrent readers with a single writer
#   busy_timeout    — wait N ms for a lock before failing
#   synchronous=NORMAL — fsync only on COMMIT (faster, still durable for our use)
#   foreign_keys=ON   — enforce FK constraints
#   temp_store=MEMORY — keep temp tables/indexes in RAM
spring.datasource.url=jdbc:sqlite:${user.home}/Library/Application Support/ByteQuay/bytequay.db?journal_mode=WAL&busy_timeout=30000&synchronous=NORMAL&foreign_keys=ON&temp_store=MEMORY
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none

# ── HikariCP pool tuning ─────────────────────────────────────────────────
# Single connection. SQLite serializes writers at the file level no
# matter how big the pool is — and an 8-connection pool turned into a
# SQLITE_BUSY generator under concurrent writes (markViewed racing with
# a PR-detail batch insert was the reproduction). Pinning the pool to
# size 1 makes both reads and writes serialize at the JDBC layer where
# the wait is well-defined (HikariCP's connection-timeout) instead of
# at SQLite's writer lock where it surfaces as an error. Reads against
# a local SQLite file are sub-millisecond, so the loss of read
# parallelism doesn't measurably change request latency.
spring.datasource.hikari.pool-name=ByteQuayPool
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
# Connection-acquisition wait. With pool=1, requests queue here when
# another thread holds the connection — bumped to 30s so a slow PR
# detail batch insert can't time out fast callers. Pair with the
# leak-detection threshold below to catch a connection holder gone wild.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
# auto-commit MUST stay true here. If we set it false, Hibernate has to
# COMMIT/ROLLBACK every borrowed connection on return, and SQLite's
# writer lock turns the pool into a serializer. Letting Hikari hand out
# autocommit-on connections also matches the default Hibernate dialect
# expects when provider_disables_autocommit is NOT set (see jpa block).
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
# Defensive PRAGMAs applied per connection at borrow time, in case the
# URL-param form ever stops being honoured by sqlite-jdbc. Mirrors the
# values set on the JDBC URL above.
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=30000;
# Trace stuck connections with a stack trace at 30s — would have caught
# the earlier "/prs/detail hangs forever" bug instantly.
spring.datasource.hikari.leak-detection-threshold=30000

# ── JPA / Hibernate ──────────────────────────────────────────────────────
# Release the JDBC connection between JPA calls within a request, so
# endpoints that call out to GitHub (e.g. /prs/detail) don't hold the
# pool while waiting on HTTP.
spring.jpa.open-in-view=false
# Batch the saveAll() patterns in the detail-store writes.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.flyway.enabled=true

# V2 execution persistence is available, but routing stays on the legacy
# workflow until a later migration slice supplies real handlers and delivery.
bytequay.development-flow.v2-dispatch-enabled=false
# Shared LEGACY/V2 executing-Task defaults. Explicit Trunk settings and
# migrated parallel-slot values override the Trunk default.
bytequay.development-flow.capacity.default-workspace-running-tasks=4
bytequay.development-flow.capacity.default-trunk-running-tasks=4
# Non-agent workflow lanes are explicit policy, not executor-pool sizes.
# CLI=4 and API=6 remain locked in CapacityManager during mixed-version drain.
bytequay.development-flow.capacity.validation=4
bytequay.development-flow.capacity.review=6
bytequay.development-flow.capacity.local-git=4
bytequay.development-flow.capacity.github=6
bytequay.development-flow.capacity.remote-observation=8
bytequay.development-flow.capacity.merge=2
bytequay.development-flow.capacity.cleanup=4
# Uses Spring's existing scheduler; it does not create another worker pool.
bytequay.development-flow.legacy-capacity-heartbeat-ms=10000
spring.flyway.locations=classpath:db/migration

# ── Threads scheduler ───────────────────────────────────────────────────
# Keep the CLI lane at 4 concurrent Claude Code subprocess turns.
# Each CLI subprocess is capped to a 512 MB V8 heap
# (ClaudeCodeCliThreadAgent sets NODE_OPTIONS), so 4 concurrent turns
# land around ~2 GB of CLI RSS. Combined with the ~2 GB JVM heap, the
# renderer/embed V8 budget (~2.5 GB with one embed open), and Electron
# overhead, this stays inside the app-wide ~8 GB ceiling.
# Raise with care: every +1 here is roughly +600 MB of CLI RSS.
bytequay.threads.scheduler.max-cli-running=4
# API-backed turns are lighter locally, but still spend provider quota,
# tool bandwidth, and user attention. Keep the first-pass cap explicit
# so packaged builds do not silently rely on the Java fallback default.
bytequay.threads.scheduler.max-api-running=6
