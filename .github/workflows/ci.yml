name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build, license check, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: backend
        # `mvn verify` runs four gates bound to the build lifecycle:
        # license-maven-plugin (header check), maven-checkstyle-plugin
        # (Trino-derived rules), Error Prone (in maven-compiler-plugin),
        # and the JUnit/Spring tests.
        run: mvn -B verify

  frontend:
    name: Frontend — lint, type check, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint catches things tsc can't see: unused identifiers,
        # missing hook deps, accidental fallthroughs, AND missing
        # Apache 2.0 license headers (eslint-plugin-header).
        # Warnings are tolerated; only errors fail the build.
        run: npm run lint

      - name: Check production dependency licenses
        working-directory: frontend
        # Fails the build if any --production npm dep ships under a
        # license that isn't in the allowlist. Catches a transitive
        # GPL / AGPL / proprietary dep slipping in via an upgrade.
        run: npm run check:licenses

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit + component tests
        working-directory: frontend
        # The render-smoke spec for PullRequestPreview catches the
        # "X is not defined" class of bug that slips past tsc when JSX
        # references a removed identifier — so we run this as a hard
        # gate alongside the type check.
        run: npm test

      - name: Build (electron-forge package)
        working-directory: frontend
        # Runs the full Vite + electron-packager pipeline without
        # producing distributables. Catches Vite plugin / asset
        # resolution / preload-bundling regressions that tsc and unit
        # tests can't see — the kind of bug that only surfaces when the
        # app is actually packaged for shipping.
        run: npm run package
