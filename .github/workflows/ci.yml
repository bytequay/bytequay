name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# Run JavaScript-based actions on the runner's Node 24 instead of
# Node 20. GitHub forces this default starting June 2nd, 2026 and
# removes Node 20 from the runner image on September 16th, 2026; opt
# in early so we're already on the supported runtime when that lands.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Keep dependency-cache restores from hanging too long on a stuck cache
  # segment. setup-java/setup-node both use actions/cache under the hood.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

# Cancel previous PR builds once a newer commit arrives. Push builds keep a
# commit-scoped group so mainline CI still records each pushed revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.sha }}
  cancel-in-progress: true

jobs:
  path-filters:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend — build, license check, tests
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: backend
        # `mvn verify` runs four gates bound to the build lifecycle:
        # license-maven-plugin (header check), maven-checkstyle-plugin
        # (Trino-derived rules), Error Prone (in maven-compiler-plugin),
        # and the JUnit/Spring tests.
        run: mvn -B verify

  frontend:
    name: Frontend — lint, type check, tests, build
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Set up Node for the renderer toolchain AND Java for the
      # generateAssets Forge hook — `npm run package` invokes mvn to
      # build the Spring Boot JAR if it's missing, and Checkstyle 13.x
      # requires JDK 21 to run, so without this the runner's default
      # JDK 17 fails with UnsupportedClassVersionError.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21 (for the Forge generateAssets hook)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint catches things tsc can't see: unused identifiers,
        # missing hook deps, accidental fallthroughs, AND missing
        # Apache 2.0 license headers (eslint-plugin-header).
        # Warnings are tolerated; only errors fail the build.
        run: npm run lint

      - name: Check production dependency licenses
        working-directory: frontend
        # Fails the build if any --production npm dep ships under a
        # license that isn't in the allowlist. Catches a transitive
        # GPL / AGPL / proprietary dep slipping in via an upgrade.
        run: npm run check:licenses

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit + component tests
        working-directory: frontend
        # The render-smoke spec for PullRequestPreview catches the
        # "X is not defined" class of bug that slips past tsc when JSX
        # references a removed identifier — so we run this as a hard
        # gate alongside the type check.
        run: npm test

      - name: Build (electron-forge package)
        working-directory: frontend
        # Runs the full Vite + electron-packager pipeline without
        # producing distributables. Catches Vite plugin / asset
        # resolution / preload-bundling regressions that tsc and unit
        # tests can't see — the kind of bug that only surfaces when the
        # app is actually packaged for shipping.
        run: npm run package

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - path-filters
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo '${{ needs.path-filters.result }}' | grep -xE 'success|skipped' || { echo 'Job "path-filters" failed' >&2; exit 1; }
          echo '${{ needs.backend.result }}' | grep -xE 'success|skipped' || { echo 'Job "backend" failed' >&2; exit 1; }
          echo '${{ needs.frontend.result }}' | grep -xE 'success|skipped' || { echo 'Job "frontend" failed' >&2; exit 1; }
