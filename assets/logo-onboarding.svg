<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- ByteQuay V4.5 — Onboarding Intro (plays once, then settles into a soft breathing pulse) -->
  <!-- Sequence: frame fades in → wave rises → slashes draw in → final breathing pulse -->
  <style><![CDATA[
    .frame {
      fill: #7C3AED;
      opacity: 0;
      transform: scale(0.92);
      transform-origin: 50px 50px;
      animation: bq-frame-in 0.5s ease-out forwards,
                 bq-breathe 4s ease-in-out 3s infinite;
    }
    @keyframes bq-frame-in {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes bq-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.015); }
    }

    .wave-fill {
      fill: #8B5CF6;
      opacity: 0;
      transform: translateY(18px);
      animation: bq-wave-rise 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }
    .wave-line {
      stroke: #A78BFA;
      stroke-width: 2;
      fill: none;
      opacity: 0;
      transform: translateY(18px);
      animation: bq-wave-rise 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
    }
    @keyframes bq-wave-rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .slash {
      stroke: #FFFFFF;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
      animation: bq-draw 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .slash-1 { animation-delay: 1.1s; }
    .slash-2 { animation-delay: 1.35s; }
    .slash-3 { animation-delay: 1.6s; }
    @keyframes bq-draw {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .frame, .slash, .wave-fill, .wave-line {
        animation: none;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  ]]></style>
  <rect class="frame" x="15" y="15" width="70" height="70" rx="12"/>
  <path class="wave-fill" d="M 15 68 Q 30 62 42 68 T 70 68 L 85 68 L 85 85 C 85 85 85 85 77 85 L 23 85 C 15 85 15 85 15 85 Z"/>
  <path class="wave-line" d="M 15 68 Q 30 62 42 68 T 70 68 L 85 68"/>
  <line class="slash slash-1" x1="32" y1="28" x2="42" y2="52"/>
  <line class="slash slash-2" x1="45" y1="28" x2="55" y2="52" opacity="0.7"/>
  <line class="slash slash-3" x1="58" y1="28" x2="68" y2="52"/>
</svg>
