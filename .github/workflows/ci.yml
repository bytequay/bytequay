name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MAVEN_OPTS: '-Xmx1G -XX:+ExitOnOutOfMemoryError'
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Agent tests run macOS tools the app depends on, such as sandbox-exec and plutil.
    runs-on: macos-latest
    # About 15 minutes on a typical runner; a slow one has taken twice that.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: temurin
          cache: maven
      - name: Build and test backend modules
        working-directory: backend
        run: mvn -B -fae verify
      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: temurin
          cache: maven
      # The IDE bundle script names each download by checksum and verifies it, so a hit only skips the fetch.
      - uses: actions/cache@v6
        with:
          path: frontend/vendor/.ide-downloads
          key: ide-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/src/ide/runtimeManifest.json') }}
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check licenses
        working-directory: frontend
        run: npm run check:licenses
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test Java runtime packaging
        run: node --test scripts/java-runtime.test.mjs
      - name: Test Lab runtime packaging
        run: node --test scripts/lab-runtime.test.mjs
      - name: Package
        working-directory: frontend
        env:
          # As in the release, the bundles outgrow the runner's default 2 GB heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run package
      - name: Start packaged backend without system Java
        run: node scripts/test-packaged-backend.mjs
      - name: Start packaged Java language server without system Java
        run: node scripts/test-packaged-ide.mjs
      - name: Start packaged Lab without system Python
        run: node scripts/test-packaged-lab.mjs

  frontend-test:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A three-core runner fits one browser suite at a time.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: temurin
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test -- --shard=${{ matrix.shard }}/3 --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/junit.xml
      - name: Upload frontend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports-${{ matrix.shard }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test Jira authorization broker
        run: node --test services/jira-auth/broker.test.mjs
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Test dev launcher
        run: python3 scripts/test_dev.py
      - name: Test review calibration
        working-directory: scripts/review-calibration
        run: uv run --locked python -m unittest discover -p 'test_*.py'
