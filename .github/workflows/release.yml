name: Release

# Triggers only on tag pushes matching v*. The plain CI workflow
# (ci.yml) handles main + PRs and does NOT run this. workflow_dispatch
# lets us re-run a flaky build manually from the Actions tab without
# re-tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# softprops/action-gh-release needs contents:write to attach assets
# to the GitHub Release.
permissions:
  contents: write

# Run JavaScript-based actions on the runner's Node 24 instead of
# Node 20. GitHub forces this default starting June 2nd, 2026 and
# removes Node 20 from the runner image on September 16th, 2026; opt
# in early so we're already on the supported runtime when that lands.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MAVEN_OPTS: "-Xmx1G -XX:+ExitOnOutOfMemoryError"
  # Keep dependency-cache restores from hanging too long on a stuck cache
  # segment. setup-java/setup-node both use actions/cache under the hood.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

# Serialize release uploads for the same tag/ref so a manual rerun cannot
# race the tag-triggered build while both attach assets to the same release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS — build DMG + ZIP
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Forge's generateAssets hook will run `mvn -DskipTests package`
      # automatically if the JAR is missing, so we don't need a separate
      # backend build step here.
      - name: Build Mac installers (DMG + ZIP)
        working-directory: frontend
        run: npm run make

      # Surface what was produced before the upload step in case we
      # need to debug a missing asset.
      - name: List built artefacts
        run: find frontend/out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -ls

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Both formats: DMG for the typical "drag to Applications"
          # flow, ZIP for users who prefer manual extraction (and what
          # update-electron-app will eventually consume).
          files: |
            frontend/out/make/**/*.dmg
            frontend/out/make/**/*.zip
          # Auto-mark as a pre-release for tags like v0.2.0-rc1 / v1.0.0-beta.
          # Final-release tags (v0.1.0, v1.0.0) are published as stable.
          prerelease: ${{ contains(github.ref, '-') }}
          # Don't fail the run when re-uploading on a manual dispatch —
          # the action overwrites existing assets of the same name.
          fail_on_unmatched_files: true
