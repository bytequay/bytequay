name: Release

# Tags publish releases. Manual branch runs verify signing and retain artifacts
# without publishing, so certificate or packaging changes can be tested first.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

# softprops/action-gh-release needs contents:write to attach assets
# to the GitHub Release.
permissions:
  contents: write

# Run JavaScript-based actions on the runner's Node 24 instead of
# Node 20. GitHub forces this default starting June 2nd, 2026 and
# removes Node 20 from the runner image on September 16th, 2026; opt
# in early so we're already on the supported runtime when that lands.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MAVEN_OPTS: "-Xmx1G -XX:+ExitOnOutOfMemoryError"
  # Keep dependency-cache restores from hanging too long on a stuck cache
  # segment. setup-java/setup-node both use actions/cache under the hood.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

# Serialize release uploads for the same tag/ref so a manual rerun cannot
# race the tag-triggered build while both attach assets to the same release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS — build DMG + ZIP
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BYTEQUAY_SIGN_RELEASE: '1'
      BYTEQUAY_NOTARY_PROFILE: bytequay-release
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          check-latest: true
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Import signing and notarization credentials
        env:
          BYTEQUAY_SIGNING_KEYCHAIN: ${{ runner.temp }}/bytequay-signing.keychain-db
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: bash scripts/prepare-macos-signing.sh

      # Forge's generateAssets hook builds the backend JAR without tests,
      # so we don't need a separate backend build step here.
      - name: Build Mac installers (DMG + ZIP)
        working-directory: frontend
        env:
          BYTEQUAY_JIRA_AUTH_URL: ${{ vars.BYTEQUAY_JIRA_AUTH_URL }}
          # The bundles build in one Node process that peaks near 4.7 GB; the runner's default
          # 2 GB heap aborts it, and Forge still exits 0 with an incomplete app.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run make

      - name: Start packaged backend without system Java
        run: node scripts/test-packaged-backend.mjs
      - name: Start packaged Java language server without system Java
        run: node scripts/test-packaged-ide.mjs
      - name: Start packaged Lab without system Python
        run: node scripts/test-packaged-lab.mjs
      - name: Check packaged dictation helper
        run: node scripts/test-packaged-dictation.mjs

      - name: Verify signed app and notarize disk image
        run: bash scripts/verify-macos-release.sh

      # Surface what was produced before the upload step in case we
      # need to debug a missing asset.
      - name: List built artefacts
        run: find frontend/out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -ls

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Both formats: DMG for the typical "drag to Applications"
          # flow, ZIP for users who prefer manual extraction (and what
          # update-electron-app will eventually consume).
          files: |
            frontend/out/make/**/*.dmg
            frontend/out/make/**/*.zip
          # Auto-mark as a pre-release for tags like v0.2.0-rc1 / v1.0.0-beta.
          # Final-release tags (v0.1.0, v1.0.0) are published as stable.
          prerelease: ${{ contains(github.ref, '-') }}
          # Don't fail the run when re-uploading on a manual dispatch —
          # the action overwrites existing assets of the same name.
          fail_on_unmatched_files: true

      - name: Retain installers from manual branch builds
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: signed-macos-installers
          path: |
            frontend/out/make/**/*.dmg
            frontend/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bytequay-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/bytequay-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/bytequay-certificate.p12" "$RUNNER_TEMP/bytequay-api-key.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
